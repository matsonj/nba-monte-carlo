name: Review SQL schema changes

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: schema-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  schema-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install project package manager
        run: pip install uv==0.12.5

      - name: Review compiled SQL changes
        uses: PresentJay/dbt-plan@5b4ef87ebb01fb88b4e3c4e0661aad281a8db52b # v0.18.4
        with:
          version: "0.18.4"
          fail-on: never
          project-dir: transform
          target-dir: ${{ runner.temp }}/dbt-plan-target
          compile-command: |
            uv sync --frozen
            mkdir -p ../data/data_catalog
            ../.venv/bin/dbt deps
            ../.venv/bin/dbt compile --profiles-dir . --target-path "$RUNNER_TEMP/dbt-plan-target" --no-partial-parse
