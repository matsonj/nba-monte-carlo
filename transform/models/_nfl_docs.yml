version: 2

models:
  - name: nfl_raw_results
    tests:
      # empty is expected at the start of a season, so warn instead of fail
      - empty_table:
          config:
            severity: warn
  - name: nfl_raw_schedule
    tests:
      - empty_table
  - name: nfl_raw_team_ratings
    tests:
      - empty_table
  - name: nfl_schedules
    columns:
      - name: game_id
        tests:
          - unique
          - not_null
      - name: type
        tests:
          - accepted_values:
              values: ['reg_season','playin_r1','playin_r2','playoffs_r1','playoffs_r2','playoffs_r3','playoffs_r4']
      - name: series_id
      - name: visiting_conf
      - name: visiting_team
        tests:
          - not_null
      - name: visiting_team_elo_rating
      - name: home_conf
      - name: home_team
        tests:
          - not_null
      - name: home_team_elo_rating
  - name: nfl_ratings
    columns:
      - name: team
        tests:
          - not_null
          - unique
      - name: conf
        tests:
          - not_null
          - accepted_values:
              values: ['AFC','NFC']
      - name: elo_rating
        tests:
          - not_null
  - name: nfl_random_num_gen
    tests:
      - empty_table
  - name: nfl_teams
    columns:
      - name: team
        tests:
          - unique
          - not_null
  - name: nfl_vegas_wins
    columns:
      - name: team
        tests:
          - unique
          - not_null
      - name: win_total
        tests:
          - not_null
  - name: nfl_bs_pod_over_unders
    description: Current-season Bill Simmons and Cousin Sal AFC and NFC win-total picks with live settlement status.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - season
            - speaker
            - team
    columns:
      - name: season
        tests:
          - not_null
      - name: speaker
        tests:
          - not_null
          - accepted_values:
              values: ['Bill Simmons', 'Cousin Sal']
      - name: team
        tests:
          - not_null
      - name: conf
        tests:
          - not_null
          - accepted_values:
              values: ['AFC','NFC']
      - name: division
        tests:
          - not_null
      - name: pick
        tests:
          - not_null
          - accepted_values:
              values: ['over', 'under']
      - name: line
        tests:
          - not_null
      - name: episode_date
        tests:
          - not_null
      - name: episode_url
        tests:
          - not_null
      - name: games_played
        tests:
          - not_null
      - name: scheduled_games
        tests:
          - not_null
      - name: current_wins
        tests:
          - not_null
      - name: current_losses
        tests:
          - not_null
      - name: current_ties
        tests:
          - not_null
      - name: regular_season_complete
        tests:
          - not_null
      - name: live_status
        tests:
          - not_null
          - accepted_values:
              values: ['On track', 'Behind', 'Win', 'Loss', 'Push']